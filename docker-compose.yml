services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Voluntariado4V_2026!
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "Voluntariado4V_2026!",
          "-C",
          "-Q",
          "SELECT 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    volumes:
      - mssql_data:/var/opt/mssql

  backend:
    build:
      context: ./Voluntariado4V_Web/backend
    environment:
      - DATABASE_URL=sqlsrv://sa:Voluntariado4V_2026!@db/VOLUNTARIADOBD?serverVersion=latest&TrustServerCertificate=true&Encrypt=false&charset=UTF-8
      - APP_ENV=dev
      - APP_SECRET=bb9f1b0a5e8c4e4b8a9b3d2c1a0f9e8d
    volumes:
      - ./Voluntariado4V_Web/backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./Voluntariado4V_Web/frontend
    ports:
      - "8081:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mssql_data:
