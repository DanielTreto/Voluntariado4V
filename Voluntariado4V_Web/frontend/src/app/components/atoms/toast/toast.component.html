<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div *ngFor="let toast of toastService.toasts()" class="toast show align-items-center text-white border-0 mb-2"
        [ngClass]="{
         'bg-success': toast.type === 'success',
         'bg-danger': toast.type === 'error',
         'bg-info': toast.type === 'info',
         'bg-warning': toast.type === 'warning'
       }" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi me-2" [ngClass]="{
          'bi-check-circle-fill': toast.type === 'success',
          'bi-exclamation-triangle-fill': toast.type === 'error' || toast.type === 'warning',
          'bi-info-circle-fill': toast.type === 'info'
        }"></i>
                {{ toast.message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" (click)="toastService.remove(toast.id)"
                aria-label="Close"></button>
        </div>
    </div>
</div>
